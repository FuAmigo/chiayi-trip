          <div class="flex items-center gap-2 mb-2">
            <span class="badge bg-primary text-white">官方飯店資訊</span>
          </div>
          <h2 class="text-xl font-black text-charcoal mb-1">${h.title}</h2>
          <p class="text-xs text-charcoal/70 mb-3 flex items-center gap-1">
            <i data-lucide="map-pin" class="w-3.5 h-3.5 text-primary"></i> ${h.address}
          </p>
          <p class="text-xs text-charcoal/70 mb-4 flex items-center gap-1">
            <i data-lucide="phone" class="w-3.5 h-3.5 text-secondary"></i> 電話：${h.phone}
          </p>

          <a href="${h.navUrl}" target="_blank" class="w-full bg-secondary text-white py-2.5 rounded-xl font-black text-xs solid-border flex items-center justify-center gap-1.5 mb-5 shadow-kawaii-sm">
            <i data-lucide="navigation" class="w-4 h-4"></i> 導航至夏禾國際行舘
          </a>

          <h3 class="font-black text-sm text-charcoal mb-2 flex items-center gap-1">
            <i data-lucide="star" class="w-4 h-4 text-accent fill-accent"></i> 館內設施與服務
          </h3>
          <div class="grid grid-cols-1 gap-2 mb-5">
            ${facilitiesHtml}
          </div>

          <h3 class="font-black text-sm text-charcoal mb-2 flex items-center gap-1">
            <i data-lucide="compass" class="w-4 h-4 text-secondary"></i> 周邊設施與亮點
          </h3>
          <ul class="bg-sand/40 p-3 rounded-xl border border-charcoal/20 space-y-2 mb-4">
            ${nearbyHtml}
          </ul>

          <div class="bg-accent/20 p-3 rounded-xl dashed-border text-xs text-charcoal">
            <span class="font-black text-primary">💡 導遊溫馨提示：</span>${h.tips}
          </div>
        `;
        container.appendChild(hotelCard);
      }
    }

    // 打開彈出式詳細攻略 Modal
    function openModal(tabKey, itemId) {
      let item = null;
      if (tabKey === 'food') {
        item = itineraryData.food.items.find(i => i.id === itemId);
      } else {
        item = itineraryData[tabKey].items.find(i => i.id === itemId);
      }

      if (!item) return;

      const modalBody = document.getElementById('modal-body');
      modalBody.innerHTML = `
        <div class="flex items-center gap-2 mb-2">
          <span class="badge ${item.categoryColor}">${item.type}</span>
          <span class="text-xs font-bold text-charcoal/60">建議停留：${item.time || '約 1 小時'}</span>
        </div>

        <h2 class="text-xl font-black text-charcoal mb-3">${item.title}</h2>

        <!-- 景點故事 -->
        <div class="bg-white p-3.5 rounded-2xl solid-border mb-3 shadow-kawaii-sm">
          <h4 class="font-black text-xs text-primary mb-1 flex items-center gap-1">
            <i data-lucide="book-open" class="w-3.5 h-3.5"></i> 景點歷史故事與簡介
          </h4>
          <p class="text-xs text-charcoal/80 leading-relaxed">${item.story}</p>
        </div>

        <!-- 標籤亮顯區域 -->
        <div class="space-y-2 mb-4 text-xs">
          <div class="bg-sand/60 p-2.5 rounded-xl border border-charcoal/30">
            <span class="font-black text-primary block mb-0.5">🏷️ 門票/消費價位：</span>
            <span class="font-bold text-charcoal">${item.ticket}</span>
          </div>

          <div class="bg-accent/30 p-2.5 rounded-xl border border-charcoal/30">
            <span class="font-black text-charcoal block mb-0.5">😋 必吃美食 / 必點菜單：</span>
            <span class="font-bold text-primary">${item.mustOrder}</span>
          </div>

          <div class="bg-secondary/20 p-2.5 rounded-xl border border-charcoal/30">
            <span class="font-black text-secondary block mb-0.5">🎁 必買伴手禮：</span>
            <span class="font-bold text-charcoal">${item.mustBuy}</span>
          </div>
        </div>

        <!-- 在地人小吃與部落客文章 -->
        <div class="bg-paper p-3 rounded-xl border border-charcoal/20 text-xs mb-4 space-y-2">
          <div>
            <span class="font-black text-charcoal">🏠 周邊在地人小吃推薦：</span>
            <span class="text-charcoal/80">${item.localFood}</span>
          </div>
          <div>
            <span class="font-black text-charcoal">💡 導遊實用攻略：</span>
            <span class="text-charcoal/80">${item.tips}</span>
          </div>
        </div>

        <!-- 部落客文章連結 -->
        <a href="${item.blogArticle}" target="_blank" class="w-full bg-accent text-charcoal py-2.5 rounded-xl font-black text-xs solid-border flex items-center justify-center gap-1.5 shadow-kawaii-sm mb-3">
          <i data-lucide="external-link" class="w-4 h-4"></i> 閱讀部落客詳細介紹文章
        </a>

        <!-- 導航按鈕 -->
        <a href="${item.navUrl}" target="_blank" class="w-full bg-secondary text-white py-2.5 rounded-xl font-black text-xs solid-border flex items-center justify-center gap-1.5 shadow-kawaii-sm">
          <i data-lucide="navigation" class="w-4 h-4"></i> 開啟 Google 地圖導航
        </a>
      `;

      // 顯示 Modal
      const backdrop = document.getElementById('modal-backdrop');
      const card = document.getElementById('modal-card');
      backdrop.classList.remove('hidden');
      setTimeout(() => {
        backdrop.classList.remove('opacity-0');
        card.classList.remove('translate-y-full');
      }, 10);

      lucide.createIcons();
    }

    // 關閉 Modal
    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      const card = document.getElementById('modal-card');
      card.classList.add('translate-y-full');
      backdrop.classList.add('opacity-0');
      setTimeout(() => {
        backdrop.classList.add('hidden');
      }, 300);
    }
  </script>
</body>
</html>
