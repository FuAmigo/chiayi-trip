    let currentTab = 'day1';

    function switchTab(tabKey) {
      currentTab = tabKey;
      
      // 更新 Tab 按鈕樣式
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-primary');
        btn.classList.add('text-charcoal/60');
      });
      const activeBtn = document.getElementById(`nav-${tabKey}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-charcoal/60');
        activeBtn.classList.add('text-primary');
      }

      // 更新天氣卡
      const weatherCard = document.getElementById('weather-card');
      if (itineraryData[tabKey] && itineraryData[tabKey].weather) {
        weatherCard.classList.remove('hidden');
        const w = itineraryData[tabKey].weather;
        document.getElementById('weather-date').innerText = w.date;
        document.getElementById('weather-text').innerText = w.text;
      } else {
        weatherCard.classList.add('hidden');
      }

      renderContent();
    }

                  </li>
                `).join('')}

      // 每日卡片 / 美食清單 渲染

    // Modal 彈窗控制

      const item = itineraryData[tabKey].items.find(i => i.id === itemId);

            <p class="text-charcoal"><span class="font-black text-secondary">推薦必點：</span>${item.mustOrder || '無'}</p>
            <p class="text-charcoal"><span class="font-black text-charcoal">推薦必買：</span>${item.mustBuy || '無'}</p>

          ${item.blogUrl ? `

            <p class="text-charcoal/70 mb-2">${item.bloggerName}：${item.blogTitle}</p>
            <a href="${item.blogUrl}" target="_blank" class="inline-block bg-white text-charcoal px-3 py-1.5 rounded-lg solid-border font-black shadow-kawaii-sm hover:bg-gray-50">
              閱讀完整部落格文章 ➔
            </a>
          </div>` : ''}

        </div>
      `;

      const backdrop = document.getElementById('modal-backdrop');
      const card = document.getElementById('modal-card');
      
      backdrop.classList.remove('hidden');
      setTimeout(() => {
        backdrop.classList.remove('opacity-0');
        card.classList.remove('translate-y-full');
      }, 10);

      lucide.createIcons();
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      const card = document.getElementById('modal-card');

      backdrop.classList.add('opacity-0');
      card.classList.add('translate-y-full');

      setTimeout(() => {
        backdrop.classList.add('hidden');
      }, 300);
    }

    // 初始載入
    window.onload = () => {
      switchTab('day1');
    };
  </script>
