    function renderCards() {
      ['day1', 'day2', 'day3', 'hotel'].forEach(key => {
        const containerId = key === 'hotel' ? 'cards-hotel' : `cards-${key.replace('day', 'day-')}`;
        const container = document.getElementById(containerId);
        if (!container) return;

        container.innerHTML = itineraryData[key].map(item => `
          <div class="item-card" onclick="openModal('${item.id}')">
            <div class="card-header">
              <span class="badge ${item.badgeClass}">${item.badge}</span>
              <span class="time-tag">${item.time}</span>
            </div>
            <div class="card-title">${item.title}</div>
            <div class="tag-row">
              ${item.tags.map(t => `<span class="highlight-tag tag-must-eat">${t}</span>`).join('')}
            </div>
            <div class="card-actions" onclick="event.stopPropagation();">
              <a class="btn btn-nav" href="${item.navUrl}" target="_blank">🗺️ 導航</a>
              <button class="btn btn-detail" onclick="openModal('${item.id}')">📖 查看完整攻略</button>
            </div>
          </div>
        `).join('');
      });
    }

    function switchTab(index) {
      const pills = document.querySelectorAll('.pill');
      const contents = document.querySelectorAll('.tab-content');
      pills.forEach((p, i) => p.classList.toggle('active', i === index));
      contents.forEach((c, i) => c.classList.toggle('active', i === index));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openModal(id) {
      let foundItem = null;
      Object.values(itineraryData).forEach(dayList => {
        const match = dayList.find(x => x.id === id);
        if (match) foundItem = match;
      });

      if (!foundItem) return;

      document.getElementById('m-title').innerText = foundItem.title;
      document.getElementById('m-story').innerHTML = foundItem.story;
      document.getElementById('m-guide').innerHTML = foundItem.guide;
      document.getElementById('m-food').innerHTML = foundItem.food;

      const blogsHtml = foundItem.blogs.map(b => 
        `<a class="blog-link" href="${b.url}" target="_blank">🔗 ${b.title} ↗</a>`
      ).join('');
      document.getElementById('m-blogs').innerHTML = blogsHtml;

      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    // Initialize
    renderCards();
  </script>
