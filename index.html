          { name: '商務休憩與閱覽區', desc: '公用電腦、印表機及質感交誼休憩空間', icon: 'laptop' },
          { name: '親子親善服務與備品', desc: '可預約兒童嬰兒床、消毒鍋與嬰兒澡盆備品', icon: 'smile' },
          { name: '自助洗衣與烘衣設備', desc: '提供投幣式洗衣機與烘乾機，適合多天旅遊', icon: 'shirt' }
        ],
        nearby: [
          { name: '博愛路家樂福 / 夜市', desc: '車程約 3 分鐘，補給採買超方便' },
          { name: '嘉義火車站', desc: '車程約 5-7 分鐘' },
          { name: '文化路夜市', desc: '車程約 8 分鐘，宵夜美食集散地' },
          { name: '全聯 / 超商便利商店', desc: '步行約 3-5 分鐘即可抵達' }
        ],
        tips: '夏禾國際行舘位於交通要道旁，房型寬敞採光佳，極為適合自駕家庭旅客入住！夜間安靜舒適好入眠。'
      }
    };

    let currentTab = 'day1';

    // 初始化頁面
    window.addEventListener('DOMContentLoaded', () => {
      renderContent('day1');
      lucide.createIcons();
    });

    // 切換 Tab 分頁
    function switchTab(tabKey) {
      currentTab = tabKey;
      
      // 更新 Nav 按鈕樣式
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-primary');
        btn.classList.add('text-charcoal/60');
      });
      document.getElementById(`nav-${tabKey}`).classList.add('text-primary');
      document.getElementById(`nav-${tabKey}`).classList.remove('text-charcoal/60');

      // 更新天氣預報卡
      const weatherCard = document.getElementById('weather-card');
      if (tabKey === 'day1' || tabKey === 'day2' || tabKey === 'day3') {
        weatherCard.classList.remove('hidden');
        const w = itineraryData[tabKey].weather;
        document.getElementById('weather-date').innerText = w.date;
        document.getElementById('weather-text').innerText = w.text;
      } else {
        weatherCard.classList.add('hidden');
      }

      renderContent(tabKey);
      lucide.createIcons();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 渲染主要內容區
    function renderContent(tabKey) {
      const container = document.getElementById('main-content');
      container.innerHTML = '';

      if (tabKey.startsWith('day')) {
        const dayData = itineraryData[tabKey];
        
        dayData.items.forEach((item, index) => {
          const card = document.createElement('div');
          card.className = 'bg-card p-4 rounded-2xl solid-border mb-4 shadow-kawaii relative overflow-hidden';
          card.innerHTML = `
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-2">
                <span class="badge ${item.categoryColor}">${item.type}</span>
                <span class="text-xs text-charcoal/60 font-black flex items-center gap-1">
                  <i data-lucide="clock" class="w-3.5 h-3.5"></i> ${item.time}
                </span>
              </div>
              <span class="text-xs font-black bg-sand px-2 py-0.5 rounded-full border border-charcoal">Step ${index + 1}</span>
            </div>

            <h3 class="text-lg font-black text-charcoal mb-1 flex items-center justify-between">
              ${item.title}
            </h3>

            <p class="text-xs text-charcoal/70 mb-3 line-clamp-2">${item.story}</p>

            <div class="bg-paper p-2.5 rounded-xl border border-charcoal/20 text-xs mb-3 space-y-1">
              <div><span class="font-black text-primary">🎫 門票資訊：</span>${item.ticket}</div>
              <div><span class="font-black text-secondary">😋 必點美食：</span>${item.mustEat}</div>
            </div>

            <div class="flex gap-2">
              <button onclick="openModal('${tabKey}', '${item.id}')" class="flex-1 bg-accent hover:bg-accent/80 text-charcoal py-2 px-3 rounded-xl font-black text-xs solid-border flex items-center justify-center gap-1 shadow-kawaii-sm">
                <i data-lucide="book-open" class="w-4 h-4"></i> 詳細導遊攻略
              </button>
              <a href="${item.navUrl}" target="_blank" class="bg-secondary hover:bg-secondary/80 text-white py-2 px-3 rounded-xl font-black text-xs solid-border flex items-center justify-center gap-1 shadow-kawaii-sm">
                <i data-lucide="navigation" class="w-4 h-4"></i> 導航
              </a>
            </div>
          `;
          container.appendChild(card);
        });

      } else if (tabKey === 'food') {
        const foodData = itineraryData.food;
        const header = document.createElement('div');
        header.className = 'bg-accent/30 p-3 rounded-2xl dashed-border mb-4 text-center';
        header.innerHTML = `<h2 class="font-black text-charcoal">${foodData.title}</h2>`;
        container.appendChild(header);

        foodData.items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'bg-card p-4 rounded-2xl solid-border mb-4 shadow-kawaii relative';
          card.innerHTML = `
            <div class="flex items-center justify-between mb-2">
              <span class="badge ${item.categoryColor}">${item.type}</span>
              <span class="text-xs font-bold text-charcoal/60">${item.ticket}</span>
            </div>
            <h3 class="text-lg font-black text-charcoal mb-1">${item.title}</h3>
            <p class="text-xs text-charcoal/70 mb-3">${item.story}</p>
            <div class="bg-paper p-2 rounded-xl border border-charcoal/20 text-xs mb-3">
              <span class="font-black text-primary">必點推薦：</span>${item.mustOrder}
            </div>
            <div class="flex gap-2">
              <button onclick="openModal('food', '${item.id}')" class="flex-1 bg-accent text-charcoal py-2 rounded-xl font-black text-xs solid-border flex items-center justify-center gap-1">
                <i data-lucide="sparkles" class="w-4 h-4"></i> 完整攻略
              </button>
              <a href="${item.navUrl}" target="_blank" class="bg-secondary text-white py-2 px-4 rounded-xl font-black text-xs solid-border flex items-center justify-center gap-1">
                <i data-lucide="navigation" class="w-4 h-4"></i> 導航
              </a>
            </div>
          `;
          container.appendChild(card);
        });

      } else if (tabKey === 'hotel') {
        const h = itineraryData.hotel;
        const hotelCard = document.createElement('div');
        hotelCard.className = 'bg-card p-5 rounded-2xl solid-border shadow-kawaii mb-4';
        
        let facilitiesHtml = h.facilities.map(f => `
          <div class="flex items-start gap-2.5 bg-paper p-2.5 rounded-xl border border-charcoal/20">
            <div class="p-1.5 bg-accent rounded-lg border border-charcoal">
              <i data-lucide="${f.icon}" class="w-4 h-4 text-charcoal"></i>
            </div>
            <div>
              <div class="font-black text-xs text-charcoal">${f.name}</div>
              <div class="text-[11px] text-charcoal/70">${f.desc}</div>
            </div>
          </div>
        `).join('');

        let nearbyHtml = h.nearby.map(n => `
          <li class="text-xs text-charcoal/80 flex items-center gap-1.5">
            <span class="text-primary font-bold">📍</span>
            <span class="font-black text-charcoal">${n.name}</span>：${n.desc}
          </li>
        `).join('');

        hotelCard.innerHTML = `
          <div class="flex items-center gap-2 mb-2">
            <span class="badge bg-primary text-white">官方飯店資訊</span>
          </div>
          <h2 class="text-xl font-black text-charcoal mb-1">${h.title}</h2>
          <p class="text-xs text-charcoal/70 mb-2 flex items-center gap-1 font-bold">
            <i data-lucide="map-pin" class="w-3.5 h-3.5 text-primary"></i> ${h.address}
          </p>
          <p class="text-xs text-charcoal/70 mb-4 flex items-center gap-1 font-bold">
            <i data-lucide="phone" class="w-3.5 h-3.5 text-secondary"></i> 電話：${h.phone}
          </p>

          <a href="${h.navUrl}" target="_blank" class="w-full bg-secondary text-white py-2.5 rounded-xl font-black text-xs solid-border flex items-center justify-center gap-1.5 mb-5 shadow-kawaii-sm">
            <i data-lucide="navigation" class="w-4 h-4"></i> 導航至夏禾國際行舘
          </a>

          <h3 class="font-black text-sm text-charcoal mb-2 flex items-center gap-1">
            <i data-lucide="star" class="w-4 h-4 text-accent fill-accent"></i> 館內設施與服務
          </h3>
          <div class="grid grid-cols-1 gap-2 mb-5">
            ${facilitiesHtml}
          </div>

          <h3 class="font-black text-sm text-charcoal mb-2 flex items-center gap-1">
            <i data-lucide="compass" class="w-4 h-4 text-secondary"></i> 周邊設施與亮點
          </h3>
          <ul class="bg-sand/40 p-3 rounded-xl border border-charcoal/20 space-y-2 mb-4">
            ${nearbyHtml}
          </ul>

          <div class="bg-accent/20 p-3 rounded-xl dashed-border text-xs text-charcoal">
            <span class="font-black text-primary">💡 導遊溫馨提示：</span>${h.tips}
          </div>
        `;
        container.appendChild(hotelCard);
      }
    }

    // 開啟彈出式詳細攻略 Modal
    function openModal(tabKey, itemId) {
      let item = null;
      if (tabKey === 'food') {
        item = itineraryData.food.items.find(i => i.id === itemId);
      } else {
        item = itineraryData[tabKey].items.find(i => i.id === itemId);
      }

      if (!item) return;

      const modalBody = document.getElementById('modal-body');
      modalBody.innerHTML = `
        <div class="flex items-center gap-2 mb-2">
          <span class="badge ${item.categoryColor}">${item.type}</span>
          <span class="text-xs text-charcoal/60 font-black">${item.time}</span>
        </div>
        
        <h2 class="text-xl font-black text-charcoal mb-2">${item.title}</h2>
        
        <!-- 景點故事與歷史 -->
        <div class="bg-white p-3 rounded-2xl dashed-border mb-4">
          <h4 class="font-black text-xs text-primary mb-1 flex items-center gap-1">
            <i data-lucide="book-open-check" class="w-4 h-4"></i> 景點歷史故事與特色
          </h4>
          <p class="text-xs text-charcoal/80 leading-relaxed">${item.story}</p>
        </div>

        <!-- 部落客推薦圖文 -->
        <div class="bg-card p-3 rounded-2xl solid-border mb-4 shadow-kawaii-sm">
          <div class="flex items-center justify-between mb-2">
            <span class="text-[11px] font-black bg-primary/20 text-primary px-2 py-0.5 rounded-full border border-primary/30">
              📸 熱門部落客實測圖文 (1年內)
            </span>
            <span class="text-[10px] text-charcoal/60 font-bold">${item.bloggerName}</span>
          </div>
          <div class="rounded-xl overflow-hidden border border-charcoal/20 mb-2 h-36 bg-sand">
            <img src="${item.blogImg}" alt="${item.title}" class="w-full h-full object-cover" />
          </div>
          <p class="text-xs font-black text-charcoal mb-2 line-clamp-1">${item.blogTitle}</p>
          <a href="${item.blogUrl}" target="_blank" class="w-full bg-paper hover:bg-sand text-charcoal py-1.5 px-3 rounded-xl font-black text-xs border border-charcoal flex items-center justify-center gap-1">
            <i data-lucide="external-link" class="w-3.5 h-3.5"></i> 開啟部落客完整圖文網誌
          </a>
        </div>

        <!-- 必吃必買重點清單 -->
        <div class="bg-sand/30 p-3 rounded-2xl border border-charcoal/20 text-xs space-y-2 mb-4">
          <div><span class="font-black text-primary">🎫 門票／預估消費：</span>${item.ticket}</div>
          <div><span class="font-black text-secondary">😋 必吃／必點推薦：</span>${item.mustEat || item.mustOrder}</div>
          <div><span class="font-black text-charcoal">🛍️ 必買伴手禮：</span>${item.mustBuy}</div>
          <div><span class="font-black text-sky-700">📍 周邊在地美食：</span>${item.localFood}</div>
        </div>

        <!-- 導遊私房攻略 -->
        <div class="bg-accent/20 p-3 rounded-2xl dashed-border mb-5 text-xs">
          <h4 class="font-black text-charcoal mb-1 flex items-center gap-1">
            <i data-lucide="compass" class="w-4 h-4 text-primary"></i> 導遊私房攻略秘笈
          </h4>
          <p class="text-charcoal/80">${item.tips}</p>
        </div>

        <!-- 按鈕區 -->
        <div class="flex gap-2">
          <a href="${item.navUrl}" target="_blank" class="w-full bg-secondary hover:bg-secondary/90 text-white py-2.5 rounded-xl font-black text-xs solid-border flex items-center justify-center gap-1.5 shadow-kawaii-sm">
            <i data-lucide="navigation" class="w-4 h-4"></i> 開啟 Google 地圖導航
          </a>
        </div>
      `;

      lucide.createIcons();

      const backdrop = document.getElementById('modal-backdrop');
      const card = document.getElementById('modal-card');
      
      backdrop.classList.remove('hidden');
      setTimeout(() => {
        backdrop.classList.remove('opacity-0');
        card.classList.remove('translate-y-full');
      }, 10);
    }

    // 關閉 Modal
    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      const card = document.getElementById('modal-card');

      backdrop.classList.add('opacity-0');
      card.classList.add('translate-y-full');

      setTimeout(() => {
        backdrop.classList.add('hidden');
      }, 300);
    }
  </script>
</body>
</html>
