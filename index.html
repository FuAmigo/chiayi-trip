    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg-color: #FFFDF9;
            --card-bg: #FFFFFF;
            --text-main: #332C27;
            --text-sub: #7A6F68;
            
            /* 日系漫畫可愛配色 */
            --manga-yellow: #FFD166;
            --manga-pink: #FF99C8;
            --manga-green: #06D6A0;
            --manga-blue: #118AB2;
            --manga-purple: #9B5DE5;

            /* 標籤色彩 */
            --tag-ticket-bg: #E0F2FE; --tag-ticket-text: #0284C7;
            --tag-food-bg: #FFE4E6; --tag-food-text: #E11D48;
            --tag-menu-bg: #FEF3C7; --tag-menu-text: #D97706;
            --tag-gift-bg: #DCFCE7; --tag-gift-text: #15803D;
            --tag-time-bg: #F3E8FF; --tag-time-text: #6B21A8;

            --border-manga: 2.5px solid #332C27;
            --shadow-manga: 4px 4px 0px #332C27;
            --radius-manga: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 90px;
            border-left: var(--border-manga);
            border-right: var(--border-manga);
        }

        /* 漫畫風 Header */
        header {
            padding: 20px;
            background: var(--manga-yellow);
            border-bottom: var(--border-manga);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title h1 {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 0px #FFF;
        }

        .header-title p {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-main);
        }

        .avatar-badge {
            background: #FFF;
            border: var(--border-manga);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 2px 2px 0px #332C27;
        }

        /* 天數 Tabs */
        .date-tabs {
            display: flex;
            gap: 10px;
            padding: 16px 16px 8px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .date-tabs::-webkit-scrollbar { display: none; }

        .date-tab {
            flex: 1;
            min-width: 100px;
            padding: 10px;
            background: #FFF;
            border: var(--border-manga);
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            box-shadow: 2px 2px 0px #332C27;
            transition: all 0.15s;
        }

        .date-tab .day-num { font-size: 15px; font-weight: 900; }
        .date-tab .day-date { font-size: 11px; font-weight: 700; color: var(--text-sub); }

        .date-tab.active {
            background: var(--manga-pink);
            transform: translateY(-2px);
            box-shadow: 3px 4px 0px #332C27;
        }

        /* 天氣預報卡片 */
        .weather-card {
            margin: 8px 16px 16px 16px;
            background: #E0F2FE;
            border: var(--border-manga);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 3px 3px 0px #332C27;
        }
        .weather-icon { font-size: 30px; }
        .weather-text .temp { font-size: 16px; font-weight: 900; color: #0284C7; }
        .weather-text .desc { font-size: 11px; font-weight: 700; color: var(--text-sub); }

        /* 卡片內容區 */
        .content-section {
            padding: 0 16px;
            display: none;
        }
        .content-section.active {
            display: block;
            animation: mangaPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes mangaPop {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 漫畫風行程卡片 */
        .card {
            background: var(--card-bg);
            border: var(--border-manga);
            border-radius: var(--radius-manga);
            padding: 18px;
            margin-bottom: 18px;
            box-shadow: var(--shadow-manga);
            position: relative;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .card:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #332C27;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .card-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 900;
            border: 1.5px solid #332C27;
        }
        .badge-spot { background: #DCFCE7; color: #15803D; }
        .badge-food { background: #FFE4E6; color: #E11D48; }
        .badge-trans { background: #F3E8FF; color: #6B21A8; }

        .card-time { font-size: 12px; font-weight: 900; color: var(--text-sub); }

        .card-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        /* 標籤列 */
        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .tag {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 8px;
            font-weight: 700;
            border: 1px solid #332C27;
        }
        .tag-ticket { background: var(--tag-ticket-bg); color: var(--tag-ticket-text); }
        .tag-food { background: var(--tag-food-bg); color: var(--tag-food-text); }
        .tag-menu { background: var(--tag-menu-bg); color: var(--tag-menu-text); }
        .tag-gift { background: var(--tag-gift-bg); color: var(--tag-gift-text); }
        .tag-time { background: var(--tag-time-bg); color: var(--tag-time-text); }

        .card-hint {
            font-size: 11px;
            color: var(--manga-purple);
            font-weight: 900;
            text-align: right;
            margin-bottom: 8px;
        }

        /* 導航按鈕 */
        .btn-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 10px;
            background: var(--manga-yellow);
            color: var(--text-main);
            border: var(--border-manga);
            border-radius: 12px;
            font-size: 13px;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 2px 2px 0px #332C27;
        }

        /* 詳情 Dialog (Modal) */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center;
            padding: 20px;
        }
        .modal-card {
            background: white; width: 100%; max-width: 440px;
            border: var(--border-manga); border-radius: 24px; padding: 22px;
            box-shadow: 6px 6px 0px #332C27; max-height: 85vh; overflow-y: auto;
            position: relative; animation: popUp 0.2s ease;
        }
        @keyframes popUp {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-title { font-size: 20px; font-weight: 900; margin-bottom: 10px; }
        .modal-section { margin-bottom: 14px; font-size: 13px; line-height: 1.6; }
        .modal-section-title { font-weight: 900; color: var(--manga-blue); margin-bottom: 4px; }
        .btn-blogger {
            display: inline-block; width: 100%; padding: 10px; text-align: center;
            background: var(--manga-green); color: white; border: var(--border-manga);
            border-radius: 12px; font-weight: 900; text-decoration: none; box-shadow: 2px 2px 0px #332C27;
            margin-top: 10px;
        }
        .btn-close {
            position: absolute; top: 14px; right: 16px; background: var(--manga-pink);
            border: var(--border-manga); width: 32px; height: 32px; border-radius: 50%;
            font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* Floating Add Button */
        .fab {
            position: fixed; bottom: 80px; right: 20px; width: 54px; height: 54px;
            background: var(--manga-pink); color: white; border-radius: 50%;
            border: var(--border-manga); display: flex; align-items: center; justify-content: center;
            font-size: 28px; box-shadow: 3px 3px 0px #332C27; cursor: pointer; z-index: 90;
        }

        /* 底部 Nav */
        .nav-bar {
            position: fixed; bottom: 0; width: 100%; max-width: 480px;
            background: #FFF; border-top: var(--border-manga);
            display: flex; justify-content: space-around; padding: 10px 0; z-index: 100;
        }
        .nav-item { font-size: 12px; font-weight: 900; color: var(--text-main); display: flex; flex-direction: column; align-items: center; gap: 2px; }
    </style>
</head>

    function renderDay(day) {
        // 天氣渲染
        const w = weatherData[day];
        document.getElementById('w-icon').innerText = w.icon;
        document.getElementById('w-temp').innerText = w.temp;
        document.getElementById('w-desc').innerText = w.desc;

        const pageEl = document.getElementById(`page-day${day}`);
        pageEl.innerHTML = '';

        const list = itineraryData.filter(item => item.day === day);

        list.forEach(item => {
            let badgeClass = item.type === 'spot' ? 'badge-spot' : item.type === 'food' ? 'badge-food' : 'badge-trans';
            let badgeText = item.type === 'spot' ? '景點 🌿' : item.type === 'food' ? '美食 🍱' : '交通 🚗';
            
            let tagsHTML = item.tags.map(t => `<span class="tag tag-${t.type}">${t.text}</span>`).join('');
            let mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.title)}`;

            let html = `
                <div class="card" onclick="openModal(${item.id})">
                    <div class="card-top">
                        <span class="card-badge ${badgeClass}">${badgeText}</span>
                        <span class="card-time">⏰ ${item.time}</span>
                    </div>
                    <div class="card-title">${item.title}</div>
                    <div class="tag-group">${tagsHTML}</div>
                    <div class="card-hint">👉 點擊卡片看導遊攻略與部落客介紹</div>
                    <a href="${mapUrl}" target="_blank" class="btn-nav" onclick="event.stopPropagation();">
                        📍 開啟 Google Maps 導航
                    </a>
                </div>
            `;
            pageEl.innerHTML += html;
        });
    }

    function switchDay(day) {
        document.querySelectorAll('.date-tab').forEach((tab, index) => {
            tab.classList.toggle('active', index + 1 === day);
        });
        document.querySelectorAll('.content-section').forEach((sec, index) => {
            sec.classList.toggle('active', index + 1 === day);
        });
        renderDay(day);
    }

    function openModal(id) {
        const item = itineraryData.find(x => x.id === id);
        if (!item) return;

        document.getElementById('m-title').innerText = item.title;
        document.getElementById('m-tags').innerHTML = item.tags.map(t => `<span class="tag tag-${t.type}">${t.text}</span>`).join('');
        document.getElementById('m-story').innerText = item.story;
        document.getElementById('m-tips').innerText = item.tips;
        document.getElementById('m-blogger').href = item.blogger;

        document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('detailModal').style.display = 'none';
    }

    window.onload = function() {
        renderDay(1);
    };
</script>
