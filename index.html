<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>嘉義漫旅 · 隨身 App</title>
    <!-- Google Fonts: Noto Sans TC & Zen Maru Gothic (日式圓體) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #FAF8F5;
            --card-bg: #FFFFFF;
            --text-main: #4A403A;
            --text-sub: #8C827A;
            --accent-green: #839B7D;
            --accent-green-light: #EBF0EA;
            --accent-orange: #E88D67;
            --accent-orange-light: #FDF1EC;
            --accent-purple: #9281A4;
            --accent-purple-light: #F2EEF5;
            
            /* 標籤色彩配置 */
            --tag-food-bg: #FFEBE5;
            --tag-food-text: #E0533C;
            --tag-menu-bg: #FFF5E0;
            --tag-menu-text: #D9822B;
            --tag-gift-bg: #E8F4EC;
            --tag-gift-text: #3D8B59;
            --tag-ticket-bg: #EBF3FA;
            --tag-ticket-text: #2B78C5;

            --border-color: #EFECE6;
            --shadow-soft: 0 8px 24px rgba(149, 137, 127, 0.08);
            --radius-main: 22px;
            --radius-card: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 100px;
        }

        /* 頂部 Header */
        header {
            padding: 24px 20px 16px 20px;
            background: rgba(250, 248, 245, 0.92);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title h1 {
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-title p {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 500;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        .header-avatar {
            width: 42px;
            height: 42px;
            background: #FFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 2px solid #FFF;
        }

        /* 天數分頁器 Date Tabs */
        .date-tabs {
            display: flex;
            gap: 10px;
            padding: 16px 20px 8px 20px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .date-tabs::-webkit-scrollbar { display: none; }

        .date-tab {
            flex: 1;
            min-width: 100px;
            padding: 10px 14px;
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .date-tab .day-num {
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .date-tab .day-date {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .date-tab.active {
            background: var(--accent-green);
            border-color: var(--accent-green);
            box-shadow: 0 4px 12px rgba(131, 155, 125, 0.3);
        }
        .date-tab.active .day-num,
        .date-tab.active .day-date {
            color: #FFFFFF;
        }

        /* 天氣預報卡片 */
        .weather-card {
            margin: 8px 20px 16px 20px;
            background: linear-gradient(135deg, #EBF3FA 0%, #FAF8F5 100%);
            border: 1px solid #D8E6F3;
            border-radius: var(--radius-card);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .weather-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .weather-icon { font-size: 26px; }
        .weather-text .temp { font-size: 16px; font-weight: 700; color: #2B547E; }
        .weather-text .desc { font-size: 11px; color: #6A89A7; }

        /* 卡片區域 */
        .content-section {
            padding: 0 20px;
            display: none;
        }
        .content-section.active {
            display: block;
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 行程卡片 */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-main);
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .card-badge {
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
        }
        .badge-spot { background: var(--accent-green-light); color: var(--accent-green); }
        .badge-food { background: var(--accent-orange-light); color: var(--accent-orange); }
        .badge-trans { background: var(--accent-purple-light); color: var(--accent-purple); }

        .card-time {
            font-size: 13px;
            color: var(--text-sub);
            font-weight: 500;
        }

        .card-title {
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
            line-height: 1.3;
        }

        /* 亮點標籤群組 */
        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .tag {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .tag-food { background: var(--tag-food-bg); color: var(--tag-food-text); }
        .tag-menu { background: var(--tag-menu-bg); color: var(--tag-menu-text); }
        .tag-gift { background: var(--tag-gift-bg); color: var(--tag-gift-text); }
        .tag-ticket { background: var(--tag-ticket-bg); color: var(--tag-ticket-text); }

        /* 景點故事 & 攻略簡介 */
        .card-story {
            font-size: 13px;
            color: #665E57;
            line-height: 1.6;
            background: #FAF8F5;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 14px;
            border-left: 3.5px solid var(--accent-green);
        }

        /* 導航按鈕 */
        .btn-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: var(--text-main);
            color: #FFFFFF;
            border: none;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(74, 64, 58, 0.15);
            transition: transform 0.15s, background 0.15s;
        }
        .btn-nav:active {
            transform: scale(0.98);
            background: #332C28;
        }

        /* Floating Add Button */
        .fab {
            position: fixed;
            bottom: 84px;
            right: 20px;
            width: 54px;
            height: 54px;
            background: var(--accent-orange);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 6px 16px rgba(232, 141, 103, 0.4);
            cursor: pointer;
            z-index: 90;
            border: 2px solid #FFF;
        }

        /* 底部原生導覽列 */
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 20px 0;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: var(--text-sub);
            cursor: pointer;
            gap: 4px;
            font-weight: 500;
        }
        .nav-item.active {
            color: var(--accent-green);
            font-weight: 700;
        }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

        /* Modal 新增行程彈窗 */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 200; justify-content: center; align-items: flex-end;
        }
        .modal-content {
            background: white; width: 100%; max-width: 480px;
            border-radius: 24px 24px 0 0; padding: 24px; animation: slideUp 0.3s ease;
        }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 4px; font-weight: 700; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 12px; border: 1px solid var(--border-color);
            border-radius: 10px; font-size: 14px; outline: none; background: #FAF8F5;
        }
        .btn-submit {
            width: 100%; padding: 12px; background: var(--accent-green);
            color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-title">
            <h1>嘉義漫旅 · 🐾</h1>
            <p>CHIAYI TRIP 2026</p>
        </div>
        <div class="header-avatar">🍵</div>
    </header>

    <!-- 日期選擇 Tabs -->
    <div class="date-tabs">
        <div class="date-tab active" onclick="switchDay(1)">
            <div class="day-num">Day 1</div>
            <div class="day-date">9/25 (五)</div>
        </div>
        <div class="date-tab" onclick="switchDay(2)">
            <div class="day-num">Day 2</div>
            <div class="day-date">9/26 (六)</div>
        </div>
        <div class="date-tab" onclick="switchDay(3)">
            <div class="day-num">Day 3</div>
            <div class="day-date">9/27 (日)</div>
        </div>
    </div>

    <!-- 每日即時天氣預報卡片 -->
    <div class="weather-card" id="weather-box">
        <div class="weather-info">
            <span class="weather-icon" id="w-icon">☀️</span>
            <div class="weather-text">
                <div class="temp" id="w-temp">29°C 晴朗舒適</div>
                <div class="desc" id="w-desc">嘉義縣大林鎮 · 適合戶外拍照</div>
            </div>
        </div>
    </div>

    <!-- 行程內容 Page 1 ~ 3 -->
    <section id="page-day1" class="content-section active"></section>
    <section id="page-day2" class="content-section"></section>
    <section id="page-day3" class="content-section"></section>

    <!-- Floating Add Button -->
    <div class="fab" onclick="openModal()">＋</div>

    <!-- 底部原生導覽列 -->
    <nav class="nav-bar">
        <div class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            行程導航
        </div>
    </nav>
</div>

<!-- 新增行程 Modal -->
<div id="addModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom: 16px; font-size: 16px; font-family:'Zen Maru Gothic';">➕ 新增自訂行程</h3>
        <div class="form-group">
            <label>天數</label>
            <select id="input-day">
                <option value="1">Day 1 (9/25)</option>
                <option value="2">Day 2 (9/26)</option>
                <option value="3">Day 3 (9/27)</option>
            </select>
        </div>
        <div class="form-group">
            <label>類型</label>
            <select id="input-type">
                <option value="spot">景點</option>
                <option value="food">美食</option>
                <option value="trans">交通</option>
            </select>
        </div>
        <div class="form-group">
            <label>時間</label>
            <input type="text" id="input-time" placeholder="例如：14:00">
        </div>
        <div class="form-group">
            <label>地點 / 名稱</label>
            <input type="text" id="input-title" placeholder="例如：阿宏師火雞肉飯">
        </div>
        <div class="form-group">
            <label>攻略導遊簡介</label>
            <input type="text" id="input-story" placeholder="簡單註記攻略或心得...">
        </div>
        <button class="btn-submit" onclick="addCustomItinerary()">新增至行程表</button>
        <button class="btn-submit" style="background:#CCC;" onclick="closeModal()">取消</button>
    </div>
</div>

<script>
    // 天氣資料
    const weatherData = {
        1: { icon: "🌤️", temp: "29°C 多雲時晴", desc: "嘉義縣大林鎮 · 陽光和煦微風" },
        2: { icon: "🌤️", temp: "28°C 晴朗舒適", desc: "嘉義市/中埔鄉 · 晚間觀展微涼" },
        3: { icon: "☀️", temp: "30°C 晴朗偏熱", desc: "臺南市左鎮區 · 注意防曬補充水分" }
    };

    // 預設三大景點與美食資料
    const defaultItinerary = [
        // Day 1
        {
            day: 1, time: "14:00", type: "spot", title: "佐登妮絲城堡",
            tags: [
                { text: "🎫 門票 $300 (可折抵消費)", type: "ticket" },
                { text: "🛍️ 必買伴手禮: 精油保養品/香氛洗沐", type: "gift" }
            ],
            story: "【景點導遊故事】全台最大歐式巴洛克風格城堡！擁有古典琦琦公主花園、克里斯松林與精油香氛體驗館。走入城堡猶如置身歐洲宮廷，是絕佳拍照打卡景點。"
        },
        // Day 2
        {
            day: 2, time: "09:30", type: "spot", title: "冷研碳索館",
            tags: [
                { text: "🎫 門票 $200 (折抵100)", type: "ticket" },
                { text: "🍧 必吃美食: 乾冰氣泡飲/漸層星空飲", type: "food" }
            ],
            story: "【景點導遊故事】全台首座以 CO₂ 二氧化碳為主題的氣體觀光工廠！最受歡迎的是乾冰瀑布與科普實驗體驗，非常適合拍出夢幻氣泡照。"
        },
        {
            day: 2, time: "11:30", type: "spot", title: "欣欣水泥森活園觀光工廠",
            tags: [
                { text: "🎫 門票 $100", type: "ticket" },
                { text: "🎁 必買伴手禮: 水泥文創新意盆栽/手作DIY", type: "gift" }
            ],
            story: "【景點導遊故事】退輔會舊水泥廠轉型！保留了巨大的水泥工廠遺跡與工業風機具，搭配綠意盎然的森林園區，充滿復古工業風冒險感。"
        },
        {
            day: 2, time: "14:00", type: "spot", title: "中埔穀倉農創園區",
            tags: [
                { text: "🎫 免費入場", type: "ticket" },
                { text: "☕ 必吃美食: 穀倉星巴克限定特調", type: "food" },
                { text: "🛍️ 必買伴手禮: 阿里山高山茶/農會限定零食", type: "gift" }
            ],
            story: "【景點導遊故事】由活化舊穀倉打造的農創文青園區，擁有全台唯一的「穀倉星巴克」，綠色藤蔓植物與老磚牆拍照非常出片。"
        },
        {
            day: 2, time: "18:00", type: "food", title: "體育館海鮮碳烤",
            tags: [
                { text: "🍽️ 必吃美食: 嘉義熱門熱炒宵夜", type: "food" },
                { text: "🔥 必點菜單: 烤招牌胡椒蝦、烤蛤蜊、招牌炒麵", type: "menu" }
            ],
            story: "【美食攻略】嘉義在地超高人氣的海鮮碳烤餐廳！食材新鮮現烤，調味入味，特別推薦炭烤海鮮與台式熱炒，適合晚餐聚會補充能量。"
        },
        {
            day: 2, time: "19:30", type: "spot", title: "2026嘉義市光織影舞 - 小熊維尼100週年 (北香湖公園)",
            tags: [
                { text: "🎫 免費入場 (18:00亮燈)", type: "ticket" },
                { text: "🎈 必看亮點: 9公尺高巨型小熊維尼/10大光影展區", type: "gift" },
                { text: "🍢 必吃美食: 微笑市集文青餐車零食", type: "food" }
            ],
            story: "【限定特展攻略】2026 年適逢迪士尼《小熊維尼》100週年，嘉義市政府於北香湖公園打造夢幻「光影森林」！展區有 9 公尺高的小熊維尼巨型氣偶與湖面上絕美的地上月亮，是秋季最震撼的視覺饗宴。"
        },
        // Day 3
        {
            day: 3, time: "10:00", type: "spot", title: "臺南左鎮化石園區",
            tags: [
                { text: "🎫 門票 $120", type: "ticket" },
                { text: "🦴 必看亮點: 早坂犀牛骨骸/古生物化石長廊", type: "gift" },
                { text: "🎁 必買伴手禮: 恐龍/化石周邊文創商品", type: "gift" }
            ],
            story: "【景點導遊故事】全台唯一化石主題博物館！整合了菜寮化石館，館藏超過上千件古生物化石，包含巨大的早坂犀牛與古象標本，寓教於樂且室內展館十分舒適。"
        }
    ];

    let currentDay = 1;
    let itineraryData = JSON.parse(localStorage.getItem('my_kawaii_trip')) || defaultItinerary;

    function saveToStorage() {
        localStorage.setItem('my_kawaii_trip', JSON.stringify(itineraryData));
    }

    function renderDay(day) {
        // 更新天氣資訊
        const w = weatherData[day];
        document.getElementById('w-icon').innerText = w.icon;
        document.getElementById('w-temp').innerText = w.temp;
        document.getElementById('w-desc').innerText = w.desc;

        // 渲染行程卡片
        const pageEl = document.getElementById(`page-day${day}`);
        pageEl.innerHTML = '';

        const list = itineraryData.filter(item => item.day === day);

        if (list.length === 0) {
            pageEl.innerHTML = `<div style="text-align:center; color:var(--text-sub); padding:40px 0; font-size:13px;">本日尚無行程，點擊右下角 ＋ 新增吧！</div>`;
            return;
        }

        list.forEach(item => {
            let badgeClass = item.type === 'spot' ? 'badge-spot' : item.type === 'food' ? 'badge-food' : 'badge-trans';
            let badgeText = item.type === 'spot' ? '景點 🌿' : item.type === 'food' ? '美食 🍱' : '交通 🚗';
            
            let tagsHTML = '';
            if (item.tags) {
                tagsHTML = item.tags.map(t => `<span class="tag tag-${t.type}">${t.text}</span>`).join('');
            }

            let mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.title)}`;

            let html = `
                <div class="card">
                    <div class="card-top">
                        <span class="card-badge ${badgeClass}">${badgeText}</span>
                        <span class="card-time">⏰ ${item.time}</span>
                    </div>
                    <div class="card-title">${item.title}</div>
                    ${tagsHTML ? `<div class="tag-group">${tagsHTML}</div>` : ''}
                    ${item.story ? `<div class="card-story">${item.story}</div>` : ''}
                    <a href="${mapUrl}" target="_blank" class="btn-nav">
                        📍 開啟 Google Maps 導航
                    </a>
                </div>
            `;
            pageEl.innerHTML += html;
        });
    }

    function switchDay(day) {
        currentDay = day;
        document.querySelectorAll('.date-tab').forEach((tab, index) => {
            tab.classList.toggle('active', index + 1 === day);
        });
        document.querySelectorAll('.content-section').forEach((sec, index) => {
            sec.classList.toggle('active', index + 1 === day);
        });
        renderDay(day);
    }

    function openModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('addModal').style.display = 'none'; }

    function addCustomItinerary() {
        const day = parseInt(document.getElementById('input-day').value);
        const type = document.getElementById('input-type').value;
        const time = document.getElementById('input-time').value || "12:00";
        const title = document.getElementById('input-title').value;
        const story = document.getElementById('input-story').value;

        if (!title) { alert('請輸入地點名稱'); return; }

        itineraryData.push({
            day, time, type, title,
            tags: [{ text: "✨ 自訂地點", type: "gift" }],
            story: story ? `【自訂筆記】${story}` : "使用者自訂新增行程。"
        });

        saveToStorage();
        closeModal();
        switchDay(day);

        document.getElementById('input-title').value = '';
        document.getElementById('input-story').value = '';
    }

    // 初始化渲染 Day 1
    window.onload = function() {
        renderDay(1);
    };
</script>
</body>
</html>
